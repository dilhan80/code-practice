services:
  nginx_demo:
    build: ./
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - keycloak_demo
    networks:
      - keycloak_nginx_dev_network

  keycloak_demo:
    image: quay.io/keycloak/keycloak:20.0.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
#      KC_HOSTNAME: localhost
      KC_HOSTNAME_ADMIN_URL: https://localhost:8443
      KC_HOSTNAME_URL: https://localhost:8443
    networks:
      - keycloak_nginx_dev_network

  postgres_keycloak_demo:
    image: postgres:14.2
    command: postgres -c 'max_connections=200'
    volumes:
      - pgdata_keycloak_nginx_demo:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5436"
    networks:
      - keycloak_nginx_dev_network

volumes:
  pgdata_keycloak_nginx_demo:
networks:
  keycloak_nginx_dev_network:
    driver: bridge
